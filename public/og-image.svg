<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F0F0F"/>
      <stop offset="100%" style="stop-color:#1a1a2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f97316"/>
      <stop offset="100%" style="stop-color:#a855f7"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Accent glow top-right -->
  <circle cx="1100" cy="80" r="200" fill="#f97316" fill-opacity="0.15"/>
  <!-- Accent glow bottom-left -->
  <circle cx="100" cy="550" r="180" fill="#a855f7" fill-opacity="0.12"/>
  <!-- Logo P mark -->
  <rect x="80" y="200" width="90" height="90" rx="20" fill="url(#accent)"/>
  <text x="125" y="265" font-family="Arial Black, sans-serif" font-size="56" font-weight="900" fill="#111111" text-anchor="middle">P</text>
  <!-- Brand name -->
  <text x="195" y="265" font-family="Arial Black, sans-serif" font-size="52" font-weight="900" fill="#ffffff">Porterful</text>
  <!-- Tagline -->
  <text x="80" y="360" font-family="Arial, sans-serif" font-size="28" fill="#a1a1aa">Music. Merch. Direct Support.</text>
  <!-- Divider -->
  <rect x="80" y="390" width="200" height="3" rx="1.5" fill="url(#accent)"/>
  <!-- Subtext -->
  <text x="80" y="440" font-family="Arial, sans-serif" font-size="22" fill="#71717a">For independent artists.</text>
  <!-- URL -->
  <text x="80" y="590" font-family="Arial, sans-serif" font-size="18" fill="#52525b">porterful.com</text>
</svg>
