name: CI/CD Pipeline

on:
  push:
    branches: [codex/porterful-production-recovery]
  pull_request:
    branches: [codex/porterful-production-recovery]

env:
  NODE_VERSION: '20'

jobs:
  # Job 1: Lint and Type Check
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run linter
        run: npm run lint
      
      - name: Type check
        run: npx tsc --noEmit

  # Job 2: Build Test
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v7
      
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build application
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://test.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: test-key
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_test
          STRIPE_SECRET_KEY: sk_test_test
          STRIPE_WEBHOOK_SECRET: whsec_test
          RESEND_API_KEY: re_test

  # Job 3: Mobile route-transition guard (no test accounts or production writes)
  hydration:
    name: Mobile Hydration
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      
      - name: Start test server
        run: npm run dev > /tmp/porterful-next.log 2>&1 &
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://test.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: test-key
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_test
          STRIPE_SECRET_KEY: sk_test_test
          STRIPE_WEBHOOK_SECRET: whsec_test
          RESEND_API_KEY: re_test

      - name: Wait for dev server
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:3000/ > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/porterful-next.log
          exit 1

      - name: Run mobile hydration guard
        run: npm run test-hydration
        env:
          TEST_URL: http://localhost:3000

      - name: Upload server log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: hydration-server-log
          path: /tmp/porterful-next.log
          retention-days: 14

  # Job 4: Security Scan
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v7
      
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci

      - name: Check for secrets in code
        run: |
          echo "Scanning for hardcoded secrets..."
          ! grep -r "sk_live_[a-zA-Z0-9]" --include="*.ts" --include="*.tsx" --include="*.js" src/ || (echo "❌ Found live Stripe keys in source code" && exit 1)
          ! grep -r "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9" --include="*.ts" --include="*.tsx" --include="*.js" src/ || (echo "❌ Found Supabase keys in source code" && exit 1)
          echo "✅ No hardcoded secrets found"

  # Production deploys are intentionally disabled in CI. Use the guarded
  # deploy:production script from the canonical recovery branch only after
  # Jonathan's explicit approval.
  # deploy:
  #   name: Deploy to Production
  #   runs-on: ubuntu-latest
  #   needs: [lint, build, security]
  #   if: github.ref == 'refs/heads/main' && github.event_name == 'push'
  #   steps:
  #     ...
